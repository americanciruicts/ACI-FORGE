events {
    worker_connections 1024;
}

http {
    server {
        listen 9001;

        # ACI FORGE API: /forge/api/* -> backend on port 2003
        location /forge/api/ {
            rewrite ^/forge/(.*) /$1 break;
            proxy_pass http://127.0.0.1:2003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ACI FORGE health
        location /forge/health {
            rewrite ^/forge/(.*) /$1 break;
            proxy_pass http://127.0.0.1:2003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # NEXUS backend (port 102)
        location /nexus/ {
            proxy_pass http://127.0.0.1:100/;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # KOSH full app (port 5002)
        location /kosh/ {
            proxy_pass http://127.0.0.1:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # BOM Tool via nginx (port 8081)
        location /bom/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 20M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
        }

        # Health check
        location /health {
            return 200 '{"status": "tunnel-proxy-healthy"}';
            add_header Content-Type application/json;
        }
    }
}
